name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint y tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        env:
          # `expo lint` carga .env; en CI se usan valores de relleno porque
          # ningun test habla con Supabase real.
          EXPO_PUBLIC_SUPABASE_URL: https://test.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: test-anon-key

      - name: Tests
        run: npm test -- --runInBand --ci

      - name: Expo doctor
        run: npx --yes expo-doctor@latest
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://test.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
